name = "playbook"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../web"

[[r2_buckets]]
binding = "PAGES_BUCKET"
bucket_name = "aired-tgplaybook-pages"

[[kv_namespaces]]
binding = "PAGES_KV"
id = "c27bcf8a926145f58bf3cc0c99f43e61"

