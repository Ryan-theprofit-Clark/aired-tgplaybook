name = "aired-tgplaybook"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../web"

[[r2_buckets]]
binding = "PAGES_BUCKET"
bucket_name = "aired-tgplaybook-pages"

[[kv_namespaces]]
binding = "PAGES_KV"
# TODO: replace with ID from `wrangler kv namespace create PAGES_KV`
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Custom domain — uncomment and configure after adding a domain to Cloudflare
# [[routes]]
# pattern = "yourdomain.com/*"
# zone_name = "yourdomain.com"
