name = "overlookedtopursued"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "../web"

[[r2_buckets]]
binding = "PAGES_BUCKET"
bucket_name = "aired-mark-pages"

[[kv_namespaces]]
binding = "PAGES_KV"
id = "656510ef72e1465f83bd4c711c34a5d4"

# Mark Nickerson's masterclass invitations, "The Leader They Can't Overlook", December 9, 2026
# (~/Documents/mark-nickerson-workshop-outreach). Ryan bought the domain for them on 2026-11-23.
# Personal pages serve at https://overlookedtopursued.com/{first-last} (clean URL, viewer.ts).
[[routes]]
pattern = "overlookedtopursued.com"
custom_domain = true

[[routes]]
pattern = "www.overlookedtopursued.com"
custom_domain = true

[vars]
# Where /r/:slug 303-redirects after logging the click: Mark's registration page.
REDIRECT_DESTINATION = "https://go.leadingwithmeaning.com/overlooked-to-pursued"
# Page tracking ("seen", ~/page-tracking): every invitation this worker serves loads the tracker.
SEEN_KIND = "mark-invite"
# utm_campaign on the /r/{slug} hop, so a registration can be tied to the person.
REDIRECT_UTM_CAMPAIGN = "mark_dec9"

# CLICK_LOG_KEY is set as a wrangler secret (not stored in this file).
